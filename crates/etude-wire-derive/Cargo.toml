[package]
name = "etude-wire-derive"
version = "0.1.0"
description = "The Wire and TaggedWire derive macros for etude-wire"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["derive", "serialization", "binary", "encoding", "wire"]
categories = ["encoding"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
