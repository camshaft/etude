[package]
name = "etude-strrope"
version = "0.1.0"
description = "A UTF-8 string rope: a validated-UTF-8 view over the etude-bytevec byte rope"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# StrRope is a newtype over `etude_bytevec::Rope<Utf8>` — the byte rope with a zero-size UTF-8 kind marker.
# The byte/rope machinery + the Utf8 validator live in etude-bytevec; this crate owns the str-facing API.
etude-bytevec = { version = "0.1", path = "../etude-bytevec" }
bytes = "1"

[dev-dependencies]
# Turn on etude-bytevec's invariant checker in this crate's tests, so every rope op composition the
# harness drives is structurally validated at its source (cached counts, tiers, no empty chunks).
etude-bytevec = { version = "0.1", path = "../etude-bytevec", features = ["testing"] }
bolero = "0.13"
bolero-generator = "0.13"
# `ops` bench: rope-shaped complexity at shallow (4-chunk) vs deep (1000-chunk) shapes.
criterion = "0.5"

[[bench]]
name = "ops"
harness = false
