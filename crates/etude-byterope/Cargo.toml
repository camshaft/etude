[package]
name = "etude-byterope"
version = "0.1.0"
description = "A relaxed-radix (RRB) byte rope: O(log32) offset lookup, structural sharing, zero-copy slice/concat"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["bytes/std", "etude-buffer/std"]
# Derive a `bolero_generator::TypeGenerator` for `ByteRope` (property/fuzz testing).
bolero-generator = ["dep:bolero-generator", "bolero-generator/alloc", "etude-buffer/generator"]
testing = ["bolero-generator", "etude-buffer/testing"]

[dependencies]
bytes = { version = "1", default-features = false }
etude-ensure = { version = "0.1", path = "../etude-ensure" }
etude-buffer = { version = "0.1", path = "../etude-buffer", default-features = false }
bolero-generator = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
etude-bytevec = { version = "0.1", path = "../etude-bytevec" }
bolero = "0.13"
bolero-generator = "0.13"
criterion = "0.5"
# Match the host allocator so benchmarks reflect production allocation behavior.
tikv-jemallocator = "0.6"

[[bench]]
name = "compare"
harness = false
