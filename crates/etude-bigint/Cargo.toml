[package]
name = "etude-bigint"
version = "0.1.0"
description = "Arbitrary-precision signed integers: a small no_std limb library with a canonical sign-magnitude form"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Force the u32-half-synthesized widening multiply (the wasm/32-bit path) on any target, so the
# differential oracle can exercise it on a 64-bit host. Off by default (64-bit uses the u128 multiply).
synth-mul = []

[dependencies]

[dev-dependencies]
# Differential oracle: every operation is checked against num-bigint (the safety net analogous to a
# reference implementation). Kept out of the shipped crate so nothing but alloc is a build dependency.
num-bigint = "0.4"
num-traits = "0.2"
# The reference gcd (num-bigint's Integer::gcd) for the head-to-head bench.
num-integer = "0.1"
# Coverage-guided property + shrinking engine for the differential harness.
bolero = "0.13"
# Benchmark scoreboard vs num-bigint across magnitude tiers.
criterion = "0.5"
# Match the host allocator so benchmarks reflect production allocation behavior.
tikv-jemallocator = "0.6"

[[bench]]
name = "arith"
harness = false
