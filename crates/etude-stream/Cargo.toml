[package]
name = "etude-stream"
version = "0.1.0"
description = "Offset-aware stream reader/writer traits layered on etude-buffer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["etude-buffer/std", "bytes/std"]
# Derive `bolero_generator::TypeGenerator` impls for property/fuzz testing.
generator = ["dep:bolero-generator", "bolero-generator/alloc", "etude-buffer/generator"]
# Expose the stream-data testing model + generators.
testing = ["generator", "etude-buffer/testing"]

[dependencies]
etude-buffer = { version = "0.1", path = "../etude-buffer" }
etude-ensure = { version = "0.1", path = "../etude-ensure" }
bytes = { version = "1", default-features = false }
bolero-generator = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
bolero = "0.13"
bolero-generator = "0.13"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
