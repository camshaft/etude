[package]
name = "etude-json"
version = "0.1.0"
description = "Copy-avoiding JSON over the etude byte-rope: a tokenizer whose tokens reference spans of the input rope rather than copying bytes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
# `std` only adds `std::error::Error` for the error type; the library floor is `no_std` + `alloc`.
std = ["etude-bytevec/std", "etude-span/std"]

[dependencies]
# The input rope. Tokens reference byte ranges of it; nothing is copied out during tokenization.
etude-bytevec = { version = "0.1", path = "../etude-bytevec", default-features = false }
# Shared byte-scanning primitives: the chunk-streaming `Cursor` and the `Span` type (re-exported).
etude-span = { version = "0.1", path = "../etude-span", default-features = false }

[dev-dependencies]
# Turn on etude-bytevec's invariant checker in this crate's tests (structural validation at the
# source for every rope the tokenizer tests build).
etude-bytevec = { version = "0.1", path = "../etude-bytevec", features = ["testing"] }
# Differential oracle: the tokenizer is checked against serde_json (the reference implementation) —
# serde_json supplies the ground-truth value for every generated document and is the arbiter of
# accept/reject. Kept out of the shipped crate so nothing but core + alloc is a build dependency.
serde_json = "1"
# Coverage-guided property + shrinking engine for the differential harness.
bolero = "0.13"
bolero-generator = "0.13"
# Build input ropes with explicit chunk layouts (to exercise tokens straddling rope-leaf boundaries).
bytes = "1"
# Benchmark scoreboard vs serde_json: time AND allocation counts (the copy-avoiding first-class axis).
criterion = "0.5"
# Match the host allocator so timing is production-representative (as in the bigint/bytevec benches).
tikv-jemallocator = "0.6"

[[bench]]
name = "tokenize"
harness = false
