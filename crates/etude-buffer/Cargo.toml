[package]
name = "etude-buffer"
version = "0.1.0"
description = "Copy-avoiding byte reader/writer buffer traits"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = []
# Derive `bolero_generator::TypeGenerator` impls for property/fuzz testing.
generator = ["dep:bolero-generator", "bolero-generator/alloc"]
# Expose the `testing` stream-data model + generators.
testing = ["generator"]

[dependencies]
etude-ensure = { version = "0.1", path = "../etude-ensure" }
bytes = "1"
bolero-generator = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
bolero = "0.13"
bolero-generator = "0.13"
