[package]
name = "etude-decimal"
version = "0.1.0"
description = "Exact base-10 arbitrary-precision decimal numbers (coeff * 10^exp) over etude-bigint"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
etude-bigint = { version = "0.1", path = "../etude-bigint" }

[dev-dependencies]
# Differential oracle: parse/compare/round-trip is checked against bigdecimal's BigDecimal (the
# arbitrary-precision reference implementation, matching our scope). Kept out of the shipped crate so
# nothing but etude-bigint + alloc is a build dependency.
bigdecimal = "0.4"
# bigdecimal re-exports num-bigint, but we depend on it explicitly for the canonical (sign, magnitude,
# exponent) decomposition used by the oracle.
num-bigint = "0.4"
# Coverage-guided property + shrinking engine for the differential harness.
bolero = "0.13"
bolero-generator = "0.13"

# criterion (rayon) and jemalloc do not build for wasm; they are only needed by the native `arith`
# bench, so gate them off wasm (mirrors the etude-bigint/-rational bench setup).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# Benchmark scoreboard vs bigdecimal across coefficient-magnitude tiers.
criterion = "0.5"
# Match the host allocator so benchmarks reflect production allocation behavior.
tikv-jemallocator = "0.6"

[[bench]]
name = "arith"
harness = false
