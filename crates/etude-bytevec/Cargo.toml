[package]
name = "etude-bytevec"
version = "0.1.0"
description = "A chunked, reference-counted byte buffer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Derive a `bolero_generator::TypeGenerator` for `ByteVec` (property/fuzz testing).
bolero-generator = ["dep:bolero-generator", "bolero-generator/alloc", "etude-buffer/generator"]
testing = ["bolero-generator", "etude-buffer/testing"]

[dependencies]
etude-buffer = { version = "0.1", path = "../etude-buffer" }
bytes = "1"
bolero-generator = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
bolero = "0.13"
bolero-generator = "0.13"
