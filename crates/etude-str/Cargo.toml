[package]
name = "etude-str"
version = "0.1.0"
description = "A cheaply-clonable, Bytes-backed UTF-8 string"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# OPTIONAL serde support: `Str` (de)serializes as a plain string. OFF by default so the default build
# stays serde-free; only a crate that wants derive-based ser/de on `Str`-bearing structs opts in with
# `features = ["serde"]`.
serde = ["dep:serde"]
# Derive-free `bolero_generator::TypeGenerator` for `Str` (property/fuzz testing), so a downstream crate
# can generate arbitrary `Str` values — e.g. a struct with a `Str` field deriving `TypeGenerator`. The
# generator produces valid UTF-8 by construction (generates a `String`, then `Str::from`), so it never
# violates the wrapped-bytes-are-UTF-8 invariant.
bolero-generator = ["dep:bolero-generator", "bolero-generator/alloc"]
# OPTIONAL integration with the `etude-buffer` copy-avoiding reader: adds `Str::from_reader`, which drains
# any `etude_buffer::reader::Buffer` byte source and validates its bytes as UTF-8, producing a `Str`. OFF
# by default so the base build stays a pure `bytes` leaf. (The reverse — reading a `Str` OUT as a byte
# source — needs no wiring: `into_bytes()` is O(1) and `bytes::Bytes` already implements `reader::Buffer`.)
buffer = ["dep:etude-buffer"]

[dependencies]
# `Str` is a newtype over `bytes::Bytes` — a clone is an O(1) refcount bump, and text/bytes share ONE
# representation so a value crosses the text/binary boundary without re-allocating.
bytes = "1"
# OPTIONAL — only pulled in by the `serde` feature (off by default). `Str` serializes as a string.
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }
# OPTIONAL — only pulled in by the `bolero-generator` feature (off by default).
bolero-generator = { version = "0.13", default-features = false, optional = true }
# OPTIONAL — only pulled in by the `buffer` feature (off by default). The copy-avoiding reader/writer traits.
etude-buffer = { version = "0.1", path = "../etude-buffer", optional = true }

[dev-dependencies]
bolero = "0.13"
bolero-generator = "0.13"
