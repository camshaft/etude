# Slow, high-value checks that provide no per-PR signal (the full-workspace Miri run takes
# 30-60+ min — longer than the fleet's push cadence, so per-PR it never completed while camping
# a runner and starving the queue; operator-authorized move 2026-09-19). Runs nightly and on
# demand; a red run is surfaced by the concierge to the owning lane, matching the advisory
# land model.

name: nightly

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Miri detects undefined behavior in `unsafe` code, so it is scoped to the four crates that
  # contain `unsafe` — etude-buffer, etude-bytevec, etude-str, etude-strrope (the byte/text
  # adapters over `bytes`/raw pointers). The other six workspace crates (bigint, decimal,
  # rational, ensure, json, span) are pure safe core/alloc code with no `unsafe`, so Miri yields
  # no UB signal for them while their deterministic suites are slow enough under the interpreter
  # that a whole-workspace run overran the cap below without ever going green. Scoping keeps full
  # UB coverage of the actual unsafe surface (each of the four crates exercises its own unsafe
  # paths plus the `bytes` unsafe it wraps) and lands the run comfortably under the cap.
  miri:
    runs-on: ubuntu-latest
    # Deterministic tests only (the bolero fuzz loops are `#[cfg_attr(miri, ignore)]` — pathologically
    # slow under Miri's interpreter, and the scale-heavy oracle/stress tests are `cfg(miri)`-capped).
    # With those caps the full 4-crate suite runs in ~45min under Miri; this 180min cap is ~4x headroom
    # (for runner variance and future test growth), not a target — it is insurance so a future unguarded
    # fuzz loop or newly-scale-blown test fails fast instead of silently camping a runner to the 6h limit.
    timeout-minutes: 180
    env:
      RUSTFLAGS: ""
      # bolero corpus discovery does a filesystem stat, which Miri's isolation blocks.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: camshaft/rust-cache@v1
      - run: cargo miri test -p etude-buffer -p etude-bytevec -p etude-str -p etude-strrope --all-features
