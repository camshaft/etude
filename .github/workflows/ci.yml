name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Every shipping crate must compile to wasm (operator directive 2026-09-19): the Cadenza
  # platform runs these crates as wasm guests. Gate the LIB targets only — benches/tests
  # (criterion, jemalloc, bolero engines) are dev-only and need not build for wasm.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - uses: camshaft/rust-cache@v1
      # pure-wasm (no OS): default features and the no_std/alloc floor
      - run: cargo check --workspace --lib --target wasm32-unknown-unknown
      - run: cargo check --workspace --lib --no-default-features --target wasm32-unknown-unknown
      # WASI (if/where the platform runs wasmtime with WASI)
      - run: cargo check --workspace --lib --target wasm32-wasip1

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: camshaft/rust-cache@v1
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Test on the same platforms as s2n-quic: linux x86_64, linux aarch64, macOS.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-24.04-arm
            rust: stable
          - os: macos-latest
            rust: stable
          # Minimum supported Rust version.
          - os: ubuntu-latest
            rust: "1.88"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: camshaft/rust-cache@v1
      - name: test (all features)
        run: cargo test --workspace --all-features
      - name: test (default features)
        run: cargo test --workspace

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: camshaft/rust-cache@v1
      - run: cargo doc --workspace --all-features --no-deps

  # `etude-ensure` and `etude-buffer` must stay no_std-compatible.
  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: camshaft/rust-cache@v1
      - run: cargo build -p etude-ensure --target thumbv7em-none-eabihf
      - run: cargo build -p etude-buffer --no-default-features --target thumbv7em-none-eabihf

  # Miri moved to the scheduled nightly workflow (operator-authorized 2026-09-19): the
  # full-workspace run takes 30-60+ min, so per-PR it never completed before being superseded
  # (zero signal) while camping a runner and starving every queued PR run. See nightly.yml.

  # Model-check the `vectored_copy` proof (and any future proofs) with Kani.
  # DISABLED (operator-authorized 2026-09-19): model-checking/kani-github-action@v1.1 (the
  # newest tag) is incompatible with the current toolchain — `cargo kani` fails during target
  # probing with "multiple input filenames provided (first two filenames are `-` and ``)".
  # `continue-on-error: true` still rendered a red check, so the job is skipped outright.
  # TODO: re-enable when a fixed kani-github-action ships (> v1.1); until then run
  # `cargo kani` locally in crates/etude-buffer for the vectored_copy proof.
  kani:
    if: false
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1.1
        with:
          working-directory: crates/etude-buffer
