name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: camshaft/rust-cache@v1
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Test on the same platforms as s2n-quic: linux x86_64, linux aarch64, macOS.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-24.04-arm
            rust: stable
          - os: macos-latest
            rust: stable
          # Minimum supported Rust version.
          - os: ubuntu-latest
            rust: "1.88"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: camshaft/rust-cache@v1
      - name: test (all features)
        run: cargo test --workspace --all-features
      - name: test (default features)
        run: cargo test --workspace

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: camshaft/rust-cache@v1
      - run: cargo doc --workspace --all-features --no-deps

  # `etude-ensure` and `etude-buffer` must stay no_std-compatible.
  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: camshaft/rust-cache@v1
      - run: cargo build -p etude-ensure --target thumbv7em-none-eabihf
      - run: cargo build -p etude-buffer --no-default-features --target thumbv7em-none-eabihf

  # The buffer adapters use `unsafe`; check them under Miri.
  miri:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      # bolero corpus discovery does a filesystem stat, which Miri's isolation blocks.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: camshaft/rust-cache@v1
      - run: cargo miri test --workspace --all-features

  # Model-check the `vectored_copy` proof (and any future proofs) with Kani.
  # Advisory for now: the pinned kani-github-action is incompatible with the current
  # toolchain (`cargo kani` passes an empty input filename). Run `cargo kani` locally.
  kani:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1.1
        with:
          working-directory: crates/etude-buffer
