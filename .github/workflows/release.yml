name: release

# Fully-automatic, TOKENLESS release pipeline — the CANONICAL camshaft pattern (backbeat / bach /
# bolero / etude); mirrored from camshaft/backbeat's release.yml. It is a SINGLE workflow: the
# crates.io OIDC publish runs in THIS file (not a reusable workflow_call), so the OIDC token's
# workflow claim is unambiguously `release.yml`, which is the filename the crates.io Trusted
# Publishers are registered under.
#
# On every push to `main`, release-plz (https://release-plz.dev):
#   - `release-pr`: keeps a version-bump + CHANGELOG "release PR" open, derived from the
#     conventional-commit history. Versions are INDEPENDENT per crate (release-plz default): a change
#     to one crate releases only it (plus any semver-required dependents), not the whole workspace.
#   - `release`: once a release PR is merged (or, for a crate not yet on crates.io, on the first run),
#     publishes each newly-versioned crate to crates.io in dependency order NATIVELY (`release-plz
#     release` — no hand-rolled publish script), creates the per-package git tags, and creates the
#     GitHub Releases.
#
# etude is a PURE-LIBRARY workspace, so unlike backbeat there is NO `binaries` job (nothing to build
# or attach). And because etude's ci.yml is CRON-ONLY (operator directive — no per-PR CI), a merge to
# `main` is otherwise ungated, so `release` depends on a `gate` job here (fmt / clippy / wasm / test)
# to keep an irreversible crates.io publish from ever shipping a red tree. (backbeat omits this gate
# because its ci.yml gates every PR; etude's does not.)
#
# AUTH: crates.io Trusted Publishing via GitHub OIDC (rust-lang/crates-io-auth-action) — NO
# CARGO_REGISTRY_TOKEN, NO PAT. Because the publish runs in the same workflow run as release-plz
# (not triggered by a tag), GitHub's anti-recursion rule never applies, so no elevated token is
# needed. One-time per-crate setup: crates.io -> each crate -> Settings -> Trusted Publishing -> repo
# `camshaft/etude`, workflow `release.yml`. Until a crate's publisher is registered the OIDC auth
# step fails (no token issued) and `release` stops before publishing anything — no partial state; a
# re-run after registration completes cleanly.

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  # Green gate before any publish. etude's ci.yml is cron-only, so this mirrors its publish-blocking
  # checks (fmt / clippy / wasm / test) in one job — `release` depends on it so a push to main can
  # never publish a red tree.
  gate:
    name: gate (fmt + clippy + wasm + test)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - uses: camshaft/rust-cache@v1
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Every shipping crate must compile to wasm (the crates run as Cadenza wasm guests). Lib targets
      # only — dev-only benches/tests need not build for wasm.
      - name: wasm (default features)
        run: cargo check --workspace --lib --target wasm32-unknown-unknown
      - name: wasm (no default features)
        run: cargo check --workspace --lib --no-default-features --target wasm32-unknown-unknown
      - name: wasm (wasip1)
        run: cargo check --workspace --lib --target wasm32-wasip1
      - name: test (all features)
        run: cargo test --workspace --all-features
      - name: test (default features)
        run: cargo test --workspace

  # Keep the version-bump + CHANGELOG "release PR" open/updated.
  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - name: release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After a release PR merges (or on the first run for an unpublished crate), publish the
  # newly-versioned crates (native, dependency-ordered) via OIDC, create the per-package git tags,
  # and create the GitHub Releases. Gated on `gate` so an ungated (cron-only-CI) merge can't publish.
  release:
    name: release-plz release (publish + tag)
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create git tags + GitHub Releases
      id-token: write # crates.io Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      # Exchange the GitHub OIDC id-token for a short-lived crates.io token (Trusted Publishing).
      - name: crates.io auth (OIDC Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: release-plz release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
