name: release-plz

# Automate the RELEASE-PREP half of the pipeline: on every push to `main`, release-plz
# (https://release-plz.dev) opens/updates a single "release" PR that
#   - bumps each workspace crate's version by the smallest correct semver step, derived from the
#     Conventional-Commit messages since its last release, and
#   - regenerates that crate's CHANGELOG.md.
# The versions + changelogs land only when a human MERGES that PR — so the version bump is reviewable
# and never surprises. This replaces hand-editing `version = ` in every Cargo.toml and hand-writing
# changelogs (the "hand-rolled bash" this layer exists to remove).
#
# PUBLISHING stays with `release.yml`, NOT here. release-plz here is release-PR ONLY (`command:
# release-pr`); it does NOT publish to crates.io and does NOT create tags (`publish`/`git_release`/
# `git_tag` are disabled in `release-plz.toml`). The publish path is unchanged: after the release PR
# merges (bumping versions on `main`), push the matching `vX.Y.Z` tag and `release.yml` runs the green
# gate + OIDC Trusted-Publishing publish in dependency order. Tagging is a deliberate human "cut the
# release" step — kept manual on purpose, because a tag pushed by this workflow's GITHUB_TOKEN would
# NOT trigger `release.yml`'s `on: push: tags` (GitHub suppresses workflow-triggered tag events to
# prevent recursion), and we avoid a stored PAT under the no-long-lived-secret directive.
on:
  push:
    branches:
      - main
  # Manual run to refresh the release PR on demand (e.g. after editing release-plz.toml).
  workflow_dispatch:

# One release-PR run at a time; never cancel an in-flight one (it may be mid-PR-update).
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  release-pr:
    name: open/update the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release-PR branch (version bumps + changelogs)
      pull-requests: write # open/update the release PR
    steps:
      # fetch-depth: 0 — release-plz walks full commit history to compute the changelog + semver bump.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: camshaft/rust-cache@v1
      - name: release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
